name: Daily Fund Research

on:
  schedule:
    # 06:30 Singapore time = 22:30 UTC previous day.
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  run-fund-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements_colab.txt

      - name: Restore fund cache
        uses: actions/cache@v4
        with:
          path: AI_Fund_Research/cache
          key: fund-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fund-cache-${{ runner.os }}-

      - name: Run quick daily
        run: |
          python fund_research_engine.py --mode quick-daily --top-n 10

      - name: Upload latest outputs to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CSV_FILE_ID: ${{ secrets.GOOGLE_DRIVE_CSV_FILE_ID }}
          GOOGLE_DRIVE_JSON_FILE_ID: ${{ secrets.GOOGLE_DRIVE_JSON_FILE_ID }}
          GOOGLE_DRIVE_MD_FILE_ID: ${{ secrets.GOOGLE_DRIVE_MD_FILE_ID }}
        run: |
          python scripts/upload_to_drive.py \
            AI_Fund_Research/output/fund_daily_summary.csv \
            AI_Fund_Research/output/fund_daily_summary.json \
            AI_Fund_Research/output/fund_daily_summary.md

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: fund-daily-output
          path: |
            AI_Fund_Research/output/fund_daily_summary.csv
            AI_Fund_Research/output/fund_daily_summary.json
            AI_Fund_Research/output/fund_daily_summary.md
            AI_Fund_Research/output/*_fund_run_status.json
