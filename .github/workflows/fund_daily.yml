name: Daily Fund Research

on:
  schedule:
    # 06:30 Singapore time = 22:30 UTC previous day.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run-fund-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements_colab.txt

      - name: Restore fund cache
        uses: actions/cache@v4
        with:
          path: AI_Fund_Research/cache
          key: fund-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fund-cache-${{ runner.os }}-

      - name: Run quick daily
        run: |
          python fund_research_engine.py --mode quick-daily --top-n 10

      - name: Upload latest outputs to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CSV_FILE_ID: ${{ secrets.GOOGLE_DRIVE_CSV_FILE_ID }}
          GOOGLE_DRIVE_JSON_FILE_ID: ${{ secrets.GOOGLE_DRIVE_JSON_FILE_ID }}
          GOOGLE_DRIVE_MD_FILE_ID: ${{ secrets.GOOGLE_DRIVE_MD_FILE_ID }}
        run: |
          python scripts/upload_to_drive.py \
            AI_Fund_Research/output/fund_daily_summary.csv \
            AI_Fund_Research/output/fund_daily_summary.json \
            AI_Fund_Research/output/fund_daily_summary.md

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: fund-daily-output
          path: |
            AI_Fund_Research/output/fund_daily_summary.csv
            AI_Fund_Research/output/fund_daily_summary.json
            AI_Fund_Research/output/fund_daily_summary.md
            AI_Fund_Research/output/*_fund_run_status.json

      - name: Keep only latest 10 workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: fund_daily.yml
          KEEP_COMPLETED_RUNS: "9"
        run: |
          set -euo pipefail
          runs_to_delete="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?status=completed&per_page=100" \
              | jq -r --argjson keep "${KEEP_COMPLETED_RUNS}" '.workflow_runs | sort_by(.created_at) | reverse | .[$keep:][]?.id'
          )"
          if [ -z "${runs_to_delete}" ]; then
            echo "No old workflow runs to delete."
            exit 0
          fi
          for run_id in ${runs_to_delete}; do
            echo "Deleting old workflow run ${run_id}"
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}"
          done
